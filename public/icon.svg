<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5E3"/>
      <stop offset="100%" stop-color="#d7c7f6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Balance scale beam -->
  <rect x="136" y="220" width="240" height="12" rx="6" fill="white"/>
  <!-- Center pillar -->
  <rect x="248" y="220" width="16" height="160" rx="8" fill="white"/>
  <!-- Base -->
  <rect x="210" y="370" width="92" height="16" rx="8" fill="white"/>
  <!-- Left pan string -->
  <line x1="156" y1="232" x2="156" y2="300" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Left pan -->
  <ellipse cx="156" cy="308" rx="36" ry="12" fill="white" opacity="0.9"/>
  <!-- Right pan string -->
  <line x1="356" y1="232" x2="356" y2="300" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Right pan -->
  <ellipse cx="356" cy="308" rx="36" ry="12" fill="white" opacity="0.9"/>
  <!-- Center fulcrum circle -->
  <circle cx="256" cy="226" r="16" fill="white" opacity="0.95"/>
  <circle cx="256" cy="226" r="6" fill="#C4B5E3"/>
</svg>
